<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Upload</title>
</head>
<body>
<h1>Upload Ảnh</h1>

<form method="post" enctype="multipart/form-data" th:action="@{/upload}">
  <input type="file" name="file" />
  <button type="submit">Tải lên</button>
</form>

<!-- Hiển thị thông báo -->
<p th:text="${msg}"></p>

<!-- Nếu msg là đường dẫn ảnh -->
<img th:if="${msg != null}" th:src="@{${msg}}" width="200" height="200" alt="Ảnh"/>

</body>
</html>
